<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ポモドーロタイマー</title>

<!-- PWA: ホーム画面に追加して単独アプリのように起動できるようにする -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e1e2f">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pomodoro">

<style>
  :root {
    --work-color: #e74c3c;
    --short-color: #27ae60;
    --long-color: #2980b9;
    --bg: #1e1e2f;
    --card-bg: #2a2a40;
    --text: #f5f5f5;
    --muted: #9a9ab0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: 'Segoe UI', 'Hiragino Sans', 'Yu Gothic', sans-serif;
    color: var(--text);
    transition: background 0.4s ease;
  }
  .card {
    background: var(--card-bg);
    border-radius: 24px;
    padding: 40px 48px;
    width: 380px;
    max-width: 90vw;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 24px;
    color: var(--muted);
    letter-spacing: 1px;
  }
  .mode-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 28px;
    background: rgba(255,255,255,0.05);
    border-radius: 12px;
    padding: 4px;
  }
  .mode-tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: transparent;
    color: var(--muted);
    border-radius: 10px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: all 0.2s ease;
  }
  .mode-tab.active {
    background: rgba(255,255,255,0.12);
    color: var(--text);
  }
  .timer-display {
    font-size: 72px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    margin: 10px 0 8px;
    letter-spacing: 2px;
  }
  .session-label {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 28px;
    min-height: 20px;
  }
  .progress-ring {
    margin: 0 auto 28px;
    display: block;
  }
  .controls {
    display: flex;
    gap: 12px;
    justify-content: center;
  }
  button.ctrl {
    padding: 14px 28px;
    border: none;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.1s ease, opacity 0.2s ease;
  }
  button.ctrl:active { transform: scale(0.96); }
  #startPauseBtn {
    background: linear-gradient(135deg, var(--work-color), #ff7b6b);
    color: white;
    min-width: 120px;
  }
  #resetBtn {
    background: rgba(255,255,255,0.08);
    color: var(--text);
  }
  .settings {
    margin-top: 28px;
    display: flex;
    justify-content: space-around;
    gap: 10px;
    font-size: 12px;
    color: var(--muted);
    border-top: 1px solid rgba(255,255,255,0.08);
    padding-top: 20px;
  }
  .settings label {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .settings input {
    width: 56px;
    text-align: center;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    color: var(--text);
    padding: 6px 4px;
    font-size: 14px;
  }
  .cycle-dots {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 20px;
  }
  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    transition: background 0.3s ease;
  }
  .dot.done { background: var(--work-color); }
  .toggle-row {
    margin-top: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: flex-start;
  }
  .toggle-label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
  }
  .toggle-label input {
    accent-color: var(--work-color);
    width: 15px;
    height: 15px;
    cursor: pointer;
  }
  .notify-status {
    margin-top: 10px;
    font-size: 11px;
    color: var(--muted);
    min-height: 14px;
  }
  .complete-banner {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    padding: 18px 20px;
    padding-top: max(18px, env(safe-area-inset-top));
    text-align: center;
    font-weight: 700;
    font-size: 15px;
    line-height: 1.5;
    color: white;
    background: var(--work-color);
    box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    transform: translateY(-120%);
    transition: transform 0.3s ease;
    z-index: 1000;
    cursor: pointer;
  }
  .complete-banner.show {
    transform: translateY(0);
  }
</style>
</head>
<body>

<!-- Notification API非対応ブラウザ(iOS Safari/Chrome等)向けの視覚フォールバック通知 -->
<div id="completeBanner" class="complete-banner" role="alert" aria-live="assertive"></div>

<div class="card">
  <h1>🍅 POMODORO TIMER</h1>

  <div class="mode-tabs">
    <button class="mode-tab active" data-mode="work">作業</button>
    <button class="mode-tab" data-mode="short">小休憩</button>
    <button class="mode-tab" data-mode="long">長休憩</button>
  </div>

  <svg class="progress-ring" width="200" height="200">
    <circle cx="100" cy="100" r="88" stroke="rgba(255,255,255,0.08)" stroke-width="10" fill="none"/>
    <circle id="ringProgress" cx="100" cy="100" r="88" stroke="#e74c3c" stroke-width="10" fill="none"
      stroke-linecap="round" transform="rotate(-90 100 100)"/>
  </svg>

  <div class="timer-display" id="display" style="margin-top:-160px;">25:00</div>
  <div class="session-label" id="sessionLabel">作業に集中しましょう</div>

  <div class="cycle-dots" id="cycleDots"></div>

  <div class="controls">
    <button class="ctrl" id="startPauseBtn">開始</button>
    <button class="ctrl" id="resetBtn">リセット</button>
  </div>

  <div class="settings">
    <label>作業(分)
      <input type="number" id="workInput" value="25" min="1" max="90">
    </label>
    <label>小休憩(分)
      <input type="number" id="shortInput" value="5" min="1" max="30">
    </label>
    <label>長休憩(分)
      <input type="number" id="longInput" value="15" min="1" max="60">
    </label>
  </div>

  <div class="toggle-row">
    <label class="toggle-label">
      <input type="checkbox" id="notifyToggle" checked> 通知を有効化
    </label>
    <label class="toggle-label">
      <input type="checkbox" id="autoStartToggle" checked> 次のタイマーを自動開始
    </label>
  </div>
  <div class="notify-status" id="notifyStatus"></div>
</div>

<audio id="beep" preload="auto">
  <source src="data:audio/wav;base64,UklGRl9vT18AWEFWRmZtdCAQAAAAAQABAEARAACAlAEAgAAgABgAgAG" type="audio/wav">
</audio>

<script>
(() => {
  const modes = {
    work:  { label: '作業に集中しましょう', color: '#e74c3c' },
    short: { label: 'ちょっと一息つきましょう', color: '#27ae60' },
    long:  { label: 'ゆっくり休みましょう', color: '#2980b9' },
  };

  let currentMode = 'work';
  let totalSeconds = 25 * 60;
  let remaining = totalSeconds;
  let running = false;
  let timerId = null;
  let endTime = null; // Date.now() + remaining*1000。実行中のみセットし、経過時刻から逆算することでバックグラウンド遷移時のずれを吸収する
  let completedWorkSessions = 0; // out of 4 before long break
  let wakeLock = null; // 画面消灯によるタイマー停止(に見える現象)を防ぐためのScreen Wake Lock
  let titleFlashId = null;

  const display = document.getElementById('display');
  const sessionLabel = document.getElementById('sessionLabel');
  const startPauseBtn = document.getElementById('startPauseBtn');
  const resetBtn = document.getElementById('resetBtn');
  const modeTabs = document.querySelectorAll('.mode-tab');
  const ring = document.getElementById('ringProgress');
  const cycleDotsEl = document.getElementById('cycleDots');
  const workInput = document.getElementById('workInput');
  const shortInput = document.getElementById('shortInput');
  const longInput = document.getElementById('longInput');
  const beep = document.getElementById('beep');
  const notifyToggle = document.getElementById('notifyToggle');
  const autoStartToggle = document.getElementById('autoStartToggle');
  const notifyStatus = document.getElementById('notifyStatus');
  const completeBanner = document.getElementById('completeBanner');

  const CIRC = 2 * Math.PI * 88;
  ring.style.strokeDasharray = CIRC;

  // iOSのChrome/SafariはWebKit採用のためNotification APIそのものが存在しない。
  // その場合でもチェックボックスは有効なままにし、画面バナー・タイトル点滅・振動でお知らせする。
  function updateNotifyStatus() {
    if (!('Notification' in window)) {
      notifyStatus.textContent = 'この端末は通知APIに未対応です(iOSのSafari/Chrome等)。画面表示・音・振動でお知らせします';
      return;
    }
    if (Notification.permission === 'denied') {
      notifyStatus.textContent = '通知がブロックされています。画面表示・音でお知らせします';
    } else if (Notification.permission === 'default') {
      notifyStatus.textContent = 'タイマー開始時に通知の許可を求めます';
    } else {
      notifyStatus.textContent = '';
    }
  }

  function ensureNotificationPermission() {
    if (!('Notification' in window)) return;
    if (Notification.permission === 'default') {
      Notification.requestPermission().then(updateNotifyStatus);
    }
  }

  let bannerTimeoutId = null;
  function showCompleteBanner(text) {
    completeBanner.textContent = text;
    completeBanner.classList.add('show');
    clearTimeout(bannerTimeoutId);
    bannerTimeoutId = setTimeout(() => completeBanner.classList.remove('show'), 6000);
  }
  completeBanner.addEventListener('click', () => {
    completeBanner.classList.remove('show');
    stopTitleFlash();
  });

  // タブを開いていない間はネイティブ通知が使えない環境もあるため、
  // タブに戻ってきた瞬間に気づけるようタイトルを点滅させる
  function startTitleFlash(text) {
    stopTitleFlash();
    let toggle = false;
    titleFlashId = setInterval(() => {
      document.title = toggle ? text : `${display.textContent} - ポモドーロタイマー`;
      toggle = !toggle;
    }, 1000);
  }
  function stopTitleFlash() {
    if (titleFlashId) {
      clearInterval(titleFlashId);
      titleFlashId = null;
      document.title = `${display.textContent} - ポモドーロタイマー`;
    }
  }

  function notify(title, body) {
    if (!notifyToggle.checked) return;

    showCompleteBanner(`${title}\n${body}`);
    startTitleFlash(`⏰ ${title}`);

    if ('vibrate' in navigator) {
      navigator.vibrate([200, 100, 200]);
    }

    if (!('Notification' in window)) return;
    if (Notification.permission !== 'granted') return;
    try {
      const n = new Notification(title, {
        body,
        icon: 'icons/icon-192.png',
        tag: 'pomodoro-timer'
      });
      setTimeout(() => n.close(), 8000);
    } catch (e) {}
  }

  // 画面ロック/スリープでタイマーが止まって見える現象への対策。
  // 実行中は画面のスリープを止め、タブがバックグラウンドで再取得できない場合も
  // 可視化復帰時(visibilitychange)に再取得を試みる
  async function requestWakeLock() {
    if (!('wakeLock' in navigator)) return;
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } catch (e) {
      wakeLock = null;
    }
  }
  function releaseWakeLock() {
    if (wakeLock) {
      wakeLock.release().catch(() => {});
      wakeLock = null;
    }
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      stopTitleFlash();
      if (running) {
        tick(); // 経過時刻から残り時間を再計算し、表示のずれを即座に補正
        requestWakeLock(); // タブ切り替えで自動解放されるため再取得
      }
    }
  });

  updateNotifyStatus();

  function getMinutesForMode(mode) {
    if (mode === 'work') return parseInt(workInput.value) || 25;
    if (mode === 'short') return parseInt(shortInput.value) || 5;
    return parseInt(longInput.value) || 15;
  }

  function renderDots() {
    cycleDotsEl.innerHTML = '';
    for (let i = 0; i < 4; i++) {
      const d = document.createElement('div');
      d.className = 'dot' + (i < completedWorkSessions % 4 ? ' done' : '');
      cycleDotsEl.appendChild(d);
    }
  }

  function updateDisplay() {
    const m = Math.floor(remaining / 60).toString().padStart(2, '0');
    const s = Math.floor(remaining % 60).toString().padStart(2, '0');
    display.textContent = `${m}:${s}`;
    // タイトル点滅中はここでタイトルを上書きしない(点滅側が display.textContent を見て制御する)
    if (!titleFlashId) {
      document.title = `${m}:${s} - ポモドーロタイマー`;
    }

    const progress = 1 - remaining / totalSeconds;
    ring.style.strokeDashoffset = CIRC * (1 - progress);
  }

  function setMode(mode, resetTimer = true) {
    currentMode = mode;
    modeTabs.forEach(tab => tab.classList.toggle('active', tab.dataset.mode === mode));
    ring.setAttribute('stroke', modes[mode].color);
    document.documentElement.style.setProperty('--work-color', modes[mode].color);
    sessionLabel.textContent = modes[mode].label;

    if (resetTimer) {
      pause();
      totalSeconds = getMinutesForMode(mode) * 60;
      remaining = totalSeconds;
      updateDisplay();
      saveState();
    }
  }

  function tick() {
    if (!running) return;
    remaining = Math.max(0, Math.round((endTime - Date.now()) / 1000));
    updateDisplay();
    if (remaining <= 0) {
      pause();
      try { beep.currentTime = 0; beep.play().catch(() => {}); } catch (e) {}
      handleSessionComplete();
    }
  }

  function handleSessionComplete() {
    let nextMode;
    if (currentMode === 'work') {
      completedWorkSessions++;
      renderDots();
      nextMode = completedWorkSessions % 4 === 0 ? 'long' : 'short';
    } else {
      nextMode = 'work';
    }

    notify(
      `${modes[currentMode].label.replace(/しましょう$/, '')}完了！`,
      `次は「${nextMode === 'work' ? '作業' : nextMode === 'short' ? '小休憩' : '長休憩'}」(${getMinutesForMode(nextMode)}分)です`
    );

    setMode(nextMode);

    if (autoStartToggle.checked) {
      start();
    }
  }

  function start() {
    if (running) return;
    ensureNotificationPermission();
    running = true;
    startPauseBtn.textContent = '一時停止';
    endTime = Date.now() + remaining * 1000;
    requestWakeLock();
    // setIntervalは1000msより短い周期にしておくと、間隔のずれが蓄積しても
    // 表示上の遅延が目立ちにくい(実際の残り時間は常にendTimeから逆算する)
    timerId = setInterval(tick, 250);
    saveState();
  }

  function pause() {
    running = false;
    startPauseBtn.textContent = '開始';
    clearInterval(timerId);
    releaseWakeLock();
    saveState();
  }

  function reset() {
    pause();
    totalSeconds = getMinutesForMode(currentMode) * 60;
    remaining = totalSeconds;
    endTime = null;
    updateDisplay();
    saveState();
  }

  // スマホでバックグラウンドに回すとOS/ブラウザがJS実行自体を止めてしまい、
  // 復帰時にページが再読み込みされて実行中のタイマー状態が消えることがある(iOSのPWAで顕著)。
  // そうなると通知も次セッションの自動開始も発生しないため、状態をlocalStorageに保存しておき、
  // 再読み込み後に「経過時間を追いつかせる」ことで、戻ってきた時点で正しい状態に復元する
  const STORAGE_KEY = 'pomodoroState';

  function saveState() {
    const state = {
      currentMode,
      totalSeconds,
      remaining,
      running,
      endTime,
      completedWorkSessions,
      workMin: workInput.value,
      shortMin: shortInput.value,
      longMin: longInput.value,
      notify: notifyToggle.checked,
      autoStart: autoStartToggle.checked,
    };
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  function loadState() {
    let saved;
    try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (e) { saved = null; }
    if (!saved) return false;

    if (saved.workMin) workInput.value = saved.workMin;
    if (saved.shortMin) shortInput.value = saved.shortMin;
    if (saved.longMin) longInput.value = saved.longMin;
    notifyToggle.checked = saved.notify !== false;
    autoStartToggle.checked = saved.autoStart !== false;
    completedWorkSessions = saved.completedWorkSessions || 0;

    setMode(saved.currentMode || 'work', false);
    totalSeconds = saved.totalSeconds || totalSeconds;
    remaining = typeof saved.remaining === 'number' ? saved.remaining : remaining;
    renderDots();
    updateDisplay();

    if (saved.running && saved.endTime) {
      running = true;
      endTime = saved.endTime;
      startPauseBtn.textContent = '一時停止';
      requestWakeLock();
      timerId = setInterval(tick, 250);
      // 保存時点から今までの経過分を即座に反映する。
      // すでに終了時刻を過ぎていればここでhandleSessionComplete経由の通知・自動開始が走る
      tick();
    }
    return true;
  }

  startPauseBtn.addEventListener('click', () => {
    running ? pause() : start();
  });

  resetBtn.addEventListener('click', reset);

  notifyToggle.addEventListener('change', () => {
    if (notifyToggle.checked) ensureNotificationPermission();
    updateNotifyStatus();
    saveState();
  });

  autoStartToggle.addEventListener('change', saveState);

  modeTabs.forEach(tab => {
    tab.addEventListener('click', () => setMode(tab.dataset.mode));
  });

  [workInput, shortInput, longInput].forEach(input => {
    input.addEventListener('change', () => {
      if (!running) {
        totalSeconds = getMinutesForMode(currentMode) * 60;
        remaining = totalSeconds;
        updateDisplay();
      }
      saveState();
    });
  });

  renderDots();
  if (!loadState()) {
    setMode('work');
  }
})();
</script>

</body>
</html>
