<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-label="大阪不動産ナビの活動エリアを示す地図イメージ">
  <rect width="1200" height="500" fill="#e7e2d4"/>
  <g stroke="#c9c1ab" stroke-width="3">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="260" x2="1200" y2="260"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
