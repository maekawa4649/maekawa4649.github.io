<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-label="大阪の街並みイメージ">
  <defs>
    <linearGradient id="heroSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c1a33"/>
      <stop offset="100%" stop-color="#2a3f6b"/>
    </linearGradient>
  </defs>
  <rect width="900" height="700" fill="url(#heroSky)"/>
  <circle cx="700" cy="150" r="90" fill="#c99a68" opacity="0.85"/>
  <g fill="#16294f">
    <rect x="40" y="420" width="90" height="230"/>
    <rect x="140" y="360" width="70" height="290"/>
    <rect x="220" y="440" width="60" height="210"/>
    <rect x="720" y="400" width="80" height="250"/>
    <rect x="800" y="460" width="60" height="190"/>
  </g>
  <!-- 大阪城をイメージした天守閣シルエット -->
  <g fill="#e7e0d1">
    <rect x="380" y="470" width="140" height="180"/>
    <rect x="400" y="400" width="100" height="80"/>
    <rect x="420" y="340" width="60" height="70"/>
    <polygon points="370,470 530,470 450,410"/>
    <polygon points="390,400 510,400 450,350"/>
    <polygon points="410,340 490,340 450,300"/>
  </g>
  <g fill="#c99a68">
    <rect x="330" y="640" width="240" height="10"/>
  </g>
  <rect x="0" y="650" width="900" height="50" fill="#f7f4ee"/>
</svg>
