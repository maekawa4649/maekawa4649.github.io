<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>日記アプリ</title>

<style>
  :root {
    --bg: #1e1e2f;
    --card-bg: #2a2a40;
    --card-bg-hover: #32324a;
    --accent: #e08a3e;
    --text: #f5f5f5;
    --muted: #9a9ab0;
    --danger: #e74c3c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    font-family: 'Segoe UI', 'Hiragino Sans', 'Yu Gothic', sans-serif;
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  .app-shell { width: 100%; max-width: 640px; }
  .app-title {
    text-align: center;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 1px;
    color: var(--muted);
    margin: 0 0 16px;
  }

  /* 画面切替タブ */
  .top-nav {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    background: rgba(255,255,255,0.05);
    border-radius: 12px;
    padding: 4px;
  }
  .nav-btn {
    flex: 1;
    padding: 12px 8px;
    border: none;
    background: transparent;
    color: var(--muted);
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.2s ease;
  }
  .nav-btn.active { background: rgba(255,255,255,0.12); color: var(--text); }

  .view[hidden] { display: none; }

  .panel {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 24px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.35);
  }
  .section-title { font-size: 16px; font-weight: 700; margin: 0 0 16px; }

  /* 作成画面 */
  .editor-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  input[type="date"], input[type="text"] {
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.05);
    color: var(--text);
    font-size: 14px;
  }
  input[type="date"] { flex: 0 0 160px; }
  input[type="text"] { flex: 1; min-width: 150px; }
  #entryTags { width: 100%; margin-bottom: 14px; }
  textarea {
    width: 100%;
    min-height: 260px;
    resize: vertical;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.05);
    color: var(--text);
    font-size: 15px;
    line-height: 1.7;
    font-family: inherit;
  }

  .photo-section { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .photo-thumbs { display: flex; flex-wrap: wrap; gap: 8px; }
  .photo-thumb { position: relative; width: 72px; height: 72px; border-radius: 10px; overflow: hidden; }
  .photo-thumb img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; display: block; }
  .photo-remove {
    position: absolute; top: 2px; right: 2px;
    width: 20px; height: 20px; padding: 0;
    border-radius: 50%; background: rgba(0,0,0,0.6);
    color: #fff; font-size: 12px; line-height: 1;
  }

  .editor-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
  .char-count { color: var(--muted); font-size: 12px; }
  .buttons { display: flex; gap: 8px; flex-wrap: wrap; }
  button, .file-label {
    display: inline-block;
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  button:hover, .file-label:hover { opacity: 0.85; }
  .btn-save { background: var(--accent); color: #1e1e2f; }
  .btn-new { background: rgba(255,255,255,0.1); color: var(--text); }
  .btn-delete { background: transparent; color: var(--danger); }
  .btn-export { background: rgba(255,255,255,0.1); color: var(--text); }
  .save-status { font-size: 12px; color: var(--muted); min-height: 16px; margin-top: 6px; }

  /* カレンダー確認画面 */
  .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .cal-title { font-size: 16px; font-weight: 700; }
  .cal-nav-btn {
    width: 32px; height: 32px; border-radius: 8px;
    background: rgba(255,255,255,0.08); color: var(--text);
    font-size: 16px; padding: 0;
  }
  .btn-today {
    display: block; margin: 8px auto 16px;
    background: rgba(255,255,255,0.08); color: var(--muted);
    font-size: 12px; padding: 6px 16px; border-radius: 999px;
  }
  .cal-weekdays {
    display: grid; grid-template-columns: repeat(7, 1fr);
    text-align: center; font-size: 12px; color: var(--muted);
    margin-bottom: 6px;
  }
  .cal-weekdays span.sun { color: #e57373; }
  .cal-weekdays span.sat { color: #64b5f6; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-cell {
    aspect-ratio: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-radius: 10px; cursor: pointer; font-size: 13px;
    background: rgba(255,255,255,0.03);
  }
  .cal-cell.empty { visibility: hidden; cursor: default; }
  .cal-cell:hover { background: var(--card-bg-hover); }
  .cal-cell.today { border: 1px solid var(--accent); }
  .cal-cell.selected { background: rgba(224,138,62,0.3); }
  .cal-cell .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); margin-top: 3px; }

  .detail-panel { margin-top: 16px; }
  .detail-date { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .detail-title { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
  .detail-body { font-size: 14px; line-height: 1.8; white-space: pre-wrap; margin: 12px 0; }
  .entry-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
  .tag-chip { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: rgba(224,138,62,0.18); color: var(--accent); }
  .empty-msg { color: var(--muted); font-size: 13px; margin: 4px 0 16px; }
</style>
</head>
<body>

<div class="app-shell">
  <h1 class="app-title">日記</h1>

  <nav class="top-nav">
    <button class="nav-btn active" id="navWrite">✏️ 日記を書く</button>
    <button class="nav-btn" id="navCalendar">📅 カレンダーで確認</button>
  </nav>

  <!-- 作成画面: その日の日記を書いて保存する -->
  <section id="writeView" class="view">
    <div class="panel">
      <h2 class="section-title">日記を書く</h2>
      <div class="editor-row">
        <input type="date" id="entryDate">
        <input type="text" id="entryTitle" placeholder="タイトル(任意)">
      </div>
      <input type="text" id="entryTags" placeholder="タグ(カンマ区切り 例: 旅行, 仕事)">

      <div class="photo-section">
        <label class="file-label btn-new" for="photoInput">写真を追加</label>
        <input type="file" id="photoInput" accept="image/*" multiple style="display:none">
        <div class="photo-thumbs" id="photoThumbs"></div>
      </div>

      <textarea id="entryBody" placeholder="今日はどんな一日でしたか?"></textarea>
      <div class="editor-footer">
        <span class="char-count" id="charCount">0文字</span>
        <div class="buttons">
          <button class="btn-delete" id="deleteBtn">削除</button>
          <button class="btn-new" id="newBtn">新規</button>
          <button class="btn-save" id="saveBtn">保存</button>
        </div>
      </div>
      <div class="save-status" id="saveStatus"></div>
    </div>
  </section>

  <!-- 確認画面: カレンダーから日付をタップしてその日の日記を見る -->
  <section id="calendarView" class="view" hidden>
    <div class="panel">
      <div class="cal-header">
        <button class="cal-nav-btn" id="prevMonth">‹</button>
        <div class="cal-title" id="calTitle"></div>
        <button class="cal-nav-btn" id="nextMonth">›</button>
      </div>
      <button class="btn-today" id="todayBtn">今日</button>
      <div class="cal-weekdays">
        <span class="sun">日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span class="sat">土</span>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>

    <div class="panel detail-panel" id="detailPanel"></div>

    <button class="btn-export" id="exportBtn" style="margin-top: 16px; width: 100%;">全データを書き出し(JSON)</button>
  </section>
</div>

<script>
  // LocalStorage 上での日記データの保存キー。
  // { "YYYY-MM-DD": { title, body, tags, photos, updatedAt } } という日付キーの辞書として保持する。
  const STORAGE_KEY = 'diaryEntries';

  const navWrite = document.getElementById('navWrite');
  const navCalendar = document.getElementById('navCalendar');
  const writeView = document.getElementById('writeView');
  const calendarView = document.getElementById('calendarView');

  const dateInput = document.getElementById('entryDate');
  const titleInput = document.getElementById('entryTitle');
  const tagsInput = document.getElementById('entryTags');
  const bodyInput = document.getElementById('entryBody');
  const charCount = document.getElementById('charCount');
  const saveStatus = document.getElementById('saveStatus');
  const photoInput = document.getElementById('photoInput');
  const photoThumbs = document.getElementById('photoThumbs');

  const calTitle = document.getElementById('calTitle');
  const calGrid = document.getElementById('calGrid');
  const detailPanel = document.getElementById('detailPanel');
  const exportBtn = document.getElementById('exportBtn');

  // 現在編集中の日記の元の日付。保存時に日付が変更された場合、
  // 古いキーを削除してから新しいキーで保存するために使う。
  let currentKey = null;

  // 編集中の写真(base64データURL文字列の配列)。保存ボタンを押すまでは
  // entries には反映されない(タイトル・本文と同じ扱い)。
  let currentPhotos = [];

  // カレンダー画面の表示中の年月と、選択中の日付
  const now = new Date();
  let calYear = now.getFullYear();
  let calMonth = now.getMonth(); // 0-indexed
  let selectedDate = null;

  function loadEntries() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
    } catch (e) {
      return {};
    }
  }

  // localStorage には容量上限があり、写真を多く貼ると超過しうるため
  // 例外を捕捉して呼び出し元に成否を返す。
  function saveEntries(entries) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
      return true;
    } catch (e) {
      return false;
    }
  }

  function todayString() {
    const d = new Date();
    const offset = d.getTimezoneOffset() * 60000;
    return new Date(d - offset).toISOString().slice(0, 10);
  }

  function formatDateLabel(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    const days = ['日', '月', '火', '水', '木', '金', '土'];
    return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()} (${days[d.getDay()]})`;
  }

  function parseTags(raw) {
    const seen = new Set();
    raw.split(',').forEach(t => {
      const trimmed = t.trim();
      if (trimmed) seen.add(trimmed);
    });
    return Array.from(seen);
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  /* ---------- 画面切替 ---------- */

  function switchView(view) {
    writeView.hidden = view !== 'write';
    calendarView.hidden = view !== 'calendar';
    navWrite.classList.toggle('active', view === 'write');
    navCalendar.classList.toggle('active', view === 'calendar');
    if (view === 'calendar') {
      renderCalendar();
      renderDetail();
    }
  }
  navWrite.addEventListener('click', () => switchView('write'));
  navCalendar.addEventListener('click', () => switchView('calendar'));

  /* ---------- 作成画面 ---------- */

  function loadEntry(date) {
    const entries = loadEntries();
    const e = entries[date];
    if (!e) return;
    currentKey = date;
    dateInput.value = date;
    titleInput.value = e.title || '';
    tagsInput.value = (e.tags || []).join(', ');
    bodyInput.value = e.body || '';
    currentPhotos = (e.photos || []).slice();
    renderPhotoThumbs();
    updateCharCount();
    saveStatus.textContent = '';
  }

  // 新規作成: 今日の日付をセットし、既にその日の日記があれば読み込む。
  function newEntry() {
    currentKey = null;
    dateInput.value = todayString();
    titleInput.value = '';
    tagsInput.value = '';
    bodyInput.value = '';
    currentPhotos = [];
    renderPhotoThumbs();
    updateCharCount();
    saveStatus.textContent = '';
    const entries = loadEntries();
    if (entries[dateInput.value]) {
      loadEntry(dateInput.value);
    }
  }

  // カレンダーで日記のない日をタップしたときに、その日付を指定して作成画面を開く
  function startEntryForDate(date) {
    currentKey = null;
    dateInput.value = date;
    titleInput.value = '';
    tagsInput.value = '';
    bodyInput.value = '';
    currentPhotos = [];
    renderPhotoThumbs();
    updateCharCount();
    saveStatus.textContent = '';
    switchView('write');
  }

  function updateCharCount() {
    charCount.textContent = `${bodyInput.value.length}文字`;
  }

  function renderPhotoThumbs() {
    photoThumbs.innerHTML = '';
    currentPhotos.forEach((src, idx) => {
      const wrap = document.createElement('div');
      wrap.className = 'photo-thumb';

      const img = document.createElement('img');
      img.src = src;
      img.alt = '添付写真';
      img.addEventListener('click', () => window.open(src, '_blank'));

      const removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.className = 'photo-remove';
      removeBtn.textContent = '×';
      removeBtn.addEventListener('click', () => {
        currentPhotos.splice(idx, 1);
        renderPhotoThumbs();
      });

      wrap.appendChild(img);
      wrap.appendChild(removeBtn);
      photoThumbs.appendChild(wrap);
    });
  }

  // 画像をそのまま base64 化すると localStorage の容量をすぐ食い潰すため、
  // canvas で長辺 800px・JPEG品質0.7 程度まで縮小してから保持する。
  function compressImage(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          const maxDim = 800;
          let { width, height } = img;
          if (width > maxDim || height > maxDim) {
            if (width > height) {
              height = Math.round(height * maxDim / width);
              width = maxDim;
            } else {
              width = Math.round(width * maxDim / height);
              height = maxDim;
            }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', 0.7));
        };
        img.onerror = reject;
        img.src = ev.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function handlePhotoSelect(e) {
    const files = Array.from(e.target.files);
    for (const file of files) {
      try {
        const dataUrl = await compressImage(file);
        currentPhotos.push(dataUrl);
      } catch (err) {
        // 読み込みに失敗した画像は無視して続行する
      }
    }
    renderPhotoThumbs();
    photoInput.value = '';
  }

  function saveEntry() {
    const date = dateInput.value;
    if (!date) {
      saveStatus.textContent = '日付を選択してください';
      return;
    }
    const entries = loadEntries();

    // 日付を変更して保存した場合は、元のキーのエントリを削除する
    if (currentKey && currentKey !== date) {
      delete entries[currentKey];
    }

    entries[date] = {
      title: titleInput.value.trim(),
      body: bodyInput.value,
      tags: parseTags(tagsInput.value),
      photos: currentPhotos.slice(),
      updatedAt: new Date().toISOString()
    };

    const ok = saveEntries(entries);
    if (!ok) {
      saveStatus.textContent = '保存容量の上限に達しました。写真を減らすか不要な日記を削除してください。';
      return;
    }
    currentKey = date;
    saveStatus.textContent = '保存しました';
  }

  function deleteEntry() {
    if (!currentKey) {
      newEntry();
      return;
    }
    if (!confirm('この日記を削除しますか?')) return;
    const entries = loadEntries();
    delete entries[currentKey];
    saveEntries(entries);
    newEntry();
  }

  document.getElementById('saveBtn').addEventListener('click', saveEntry);
  document.getElementById('newBtn').addEventListener('click', newEntry);
  document.getElementById('deleteBtn').addEventListener('click', deleteEntry);
  bodyInput.addEventListener('input', updateCharCount);
  photoInput.addEventListener('change', handlePhotoSelect);

  /* ---------- カレンダー確認画面 ---------- */

  function renderCalendar() {
    const entries = loadEntries();
    calTitle.textContent = `${calYear}年${calMonth + 1}月`;
    calGrid.innerHTML = '';

    const firstDay = new Date(calYear, calMonth, 1);
    const startOffset = firstDay.getDay();
    const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
    const todayStr = todayString();

    for (let i = 0; i < startOffset; i++) {
      const empty = document.createElement('div');
      empty.className = 'cal-cell empty';
      calGrid.appendChild(empty);
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${calYear}-${String(calMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const cell = document.createElement('div');
      cell.className = 'cal-cell';
      if (dateStr === todayStr) cell.classList.add('today');
      if (dateStr === selectedDate) cell.classList.add('selected');

      const hasEntry = !!entries[dateStr];
      cell.innerHTML = `<span>${d}</span>${hasEntry ? '<span class="dot"></span>' : ''}`;
      cell.addEventListener('click', () => {
        selectedDate = dateStr;
        renderCalendar();
        renderDetail();
      });
      calGrid.appendChild(cell);
    }
  }

  function changeMonth(delta) {
    calMonth += delta;
    if (calMonth < 0) { calMonth = 11; calYear--; }
    if (calMonth > 11) { calMonth = 0; calYear++; }
    renderCalendar();
  }

  function renderDetail() {
    if (!selectedDate) {
      detailPanel.innerHTML = '<div class="empty-msg">カレンダーの日付をタップしてください</div>';
      return;
    }

    const entries = loadEntries();
    const e = entries[selectedDate];

    if (!e) {
      detailPanel.innerHTML = `
        <div class="detail-date">${formatDateLabel(selectedDate)}</div>
        <div class="empty-msg">この日の日記はまだありません</div>
        <button class="btn-save" id="writeForDateBtn">この日の日記を書く</button>
      `;
      document.getElementById('writeForDateBtn').addEventListener('click', () => startEntryForDate(selectedDate));
      return;
    }

    const tagsHtml = (e.tags && e.tags.length)
      ? `<div class="entry-tags">${e.tags.map(t => `<span class="tag-chip">${escapeHtml(t)}</span>`).join('')}</div>`
      : '';
    const photosHtml = (e.photos && e.photos.length)
      ? `<div class="photo-thumbs">${e.photos.map(src => `<div class="photo-thumb"><img src="${src}" alt="添付写真"></div>`).join('')}</div>`
      : '';

    detailPanel.innerHTML = `
      <div class="detail-date">${formatDateLabel(selectedDate)}</div>
      <div class="detail-title">${escapeHtml(e.title || '(無題)')}</div>
      ${tagsHtml}
      ${photosHtml}
      <div class="detail-body">${escapeHtml(e.body || '')}</div>
      <div class="buttons">
        <button class="btn-delete" id="detailDeleteBtn">削除</button>
        <button class="btn-new" id="detailEditBtn">編集</button>
      </div>
    `;

    document.getElementById('detailEditBtn').addEventListener('click', () => {
      loadEntry(selectedDate);
      switchView('write');
    });
    document.getElementById('detailDeleteBtn').addEventListener('click', () => {
      if (!confirm('この日記を削除しますか?')) return;
      const ents = loadEntries();
      delete ents[selectedDate];
      saveEntries(ents);
      renderCalendar();
      renderDetail();
    });
    detailPanel.querySelectorAll('.photo-thumb img').forEach(img => {
      img.addEventListener('click', () => window.open(img.src, '_blank'));
    });
  }

  // 全日記を1つのJSONファイルとして書き出す(タグ・写真も含む完全なバックアップ)
  function exportData() {
    const entries = loadEntries();
    if (Object.keys(entries).length === 0) {
      alert('書き出せる日記がありません');
      return;
    }
    const dataStr = JSON.stringify(entries, null, 2);
    const blob = new Blob([dataStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `diary_export_${todayString().replace(/-/g, '')}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  document.getElementById('prevMonth').addEventListener('click', () => changeMonth(-1));
  document.getElementById('nextMonth').addEventListener('click', () => changeMonth(1));
  document.getElementById('todayBtn').addEventListener('click', () => {
    const t = new Date();
    calYear = t.getFullYear();
    calMonth = t.getMonth();
    selectedDate = todayString();
    renderCalendar();
    renderDetail();
  });
  exportBtn.addEventListener('click', exportData);

  /* ---------- 初期表示 ---------- */

  selectedDate = todayString();
  const initialEntries = loadEntries();
  if (initialEntries[todayString()]) {
    loadEntry(todayString());
  } else {
    newEntry();
  }
  switchView('write');
</script>

</body>
</html>
